name: Build Refreshed My Pixel Mod Pack
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete pack files from earlier uploads
        run: |
          rm -f app/src/main/java/com/chet/navdotstyle/ModuleApp.java
          rm -f app/src/main/java/com/chet/navbarmatch/ModuleApp.java
          rm -f app/src/main/java/dev/chet/mypixelmodpack/PackApp.java
          rm -f app/src/main/java/dev/chet/mypixelmodpack/FeatureGate.java
          rm -rf app/src/main/resources/META-INF/xposed
      - name: Check refreshed module structure
        run: python3 scripts/check_pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --stacktrace
      - name: Check built APK entry format
        run: python3 scripts/check_pack.py app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyPixelModPack-refreshed-v2.0.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
